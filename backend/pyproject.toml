[project]
name = "badi-support-backend"
version = "0.1.0"
description = "FastAPI support API with provisioned accounts and customer-isolated tickets."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.31",
  "sqlalchemy==2.0.54",
  "starlette>=1.3.1",
  "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
